name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # ponytail: ubuntu-latest ships python3; the validator is stdlib-only, so no setup-python.
      # -W error: any Python warning fails CI (OpenSSF "warnings" criterion).
      - run: python3 -W error scripts/validate.py --self-test
      - run: python3 -W error scripts/validate.py

  dco:
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require Signed-off-by on every PR commit
        env:
          # PR base/head, not github.sha (that is the synthetic merge commit).
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=""
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            git log -1 --format=%B "$c" | grep -q '^Signed-off-by: ' || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "::error::Commits without 'Signed-off-by:' (use 'git commit -s', see CONTRIBUTING.md):$missing"
            exit 1
          fi
          echo "All commits are signed off."
